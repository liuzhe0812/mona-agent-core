[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

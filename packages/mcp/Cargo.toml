[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
sha2 = "0.10"
url = "2"
http = "1"
rmcp = { version = "=3.4.1", default-features = false, features = ["client", "transport-child-process", "which-command", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
process-wrap = { version = "10", features = ["tokio1"] }

[dev-dependencies]
runtime.workspace = true
tempfile = "3"

  outline: none;
  font-size: 13px;
}
.host-input:focus {

}
.host-info {

  border-radius: 10px;
  font-size: 11px;
  color: #647669;
  margin: 17px 0;

.host-check {

  margin-top: 18px;

}
.host-check input {

  margin-top: 5px;
}
.host-error {

  font-size: 11px;

  margin-top: 13px;
}

  gap: 8px;
  margin-top: 12px;
}
.host-primary,.host-secondary {

  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  background: #223b2e;
  color: white;
  font-size: 12px;
}
.host-primary:disabled {

  cursor: wait;
}
.host-secondary {

  }
}

[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["model-management", "skills", "compaction", "spill"]
model-management = ["dep:models"]
skills = ["dep:skills"]
compaction = ["dep:compaction", "sessions/compaction"]
spill = ["dep:spill"]

[dependencies]
api.workspace = true
runtime.workspace = true
application = { workspace = true, features = ["sessions"] }
http-bridge.workspace = true
providers.workspace = true
tools.workspace = true
sessions.workspace = true
instructions.workspace = true
axum = "0.8"
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
models = { path = "../../packages/models", optional = true }
skills = { path = "../../packages/skills", optional = true }
compaction = { path = "../../packages/compaction", optional = true }
spill = { path = "../../packages/spill", optional = true }
serde.workspace = true
subtle = "2.6"
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.8"
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
reqwest.workspace = true
demo = { path = "../../examples/demo" }
tauri-bridge.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

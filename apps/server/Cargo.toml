[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
mcp = ["dep:mcp", "dep:models", "dep:getrandom"]
subagent = ["dep:subagent"]
default = ["model-management", "skills", "compaction", "spill", "projects", "memory", "history-search", "planner", "sandbox", "subagent", "mcp"]
model-management = ["dep:models"]
skills = ["dep:skills"]
compaction = ["dep:compaction", "sessions/compaction"]
spill = ["dep:spill"]
projects = ["dep:projects"]
memory = ["dep:memory"]
history-search = ["sessions/search"]
planner = ["dep:planner"]
sandbox = ["dep:sandbox", "tools/sandbox"]

[dependencies]
mcp = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }
subagent = { workspace = true, optional = true }
sandbox = { workspace = true, optional = true }
planner = { workspace = true, optional = true }
api.workspace = true
runtime.workspace = true
application = { workspace = true, features = ["sessions"] }
http-bridge.workspace = true
providers.workspace = true
tools.workspace = true
sessions.workspace = true
memory = { workspace = true, optional = true }
instructions.workspace = true
workspace = { path = "../../packages/workspace" }
projects = { path = "../../packages/projects", optional = true }
axum = "0.8"
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
models = { path = "../../packages/models", optional = true }
skills = { path = "../../packages/skills", optional = true }
compaction = { path = "../../packages/compaction", optional = true }
spill = { path = "../../packages/spill", optional = true }
serde.workspace = true
subtle = "2.6"
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.8"
tempfile = "3"
sha2 = "0.10"
portable-pty = "=0.9.0"
base64 = "0.22"

[dev-dependencies]
reqwest.workspace = true
demo = { path = "../../examples/demo" }
tauri-bridge.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

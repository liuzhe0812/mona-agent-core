[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["model-management"]
model-management = ["dep:models", "dep:serde", "dep:subtle", "dep:tower-http"]

[dependencies]
api.workspace = true
runtime.workspace = true
application.workspace = true
http-bridge.workspace = true
providers.workspace = true
demo = { path = "../../examples/demo" }
axum = "0.8"
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
models = { path = "../../packages/models", optional = true }
serde = { workspace = true, optional = true }
subtle = { version = "2.6", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
tauri-bridge.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

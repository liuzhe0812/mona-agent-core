[package]
name = "tauri-plugin-agent-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "tauri-plugin-agent-bridge"

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-plugin"]

[dependencies]
agent-api.workspace = true
agent-application.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tauri = { version = "2", default-features = false, optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }

[dev-dependencies]
agent-core.workspace = true
agent-demo = { path = "../../examples/demo" }

[workspace]
resolver = "2"
members = [
  "packages/sessions", "packages/instructions",
  "packages/api", "packages/runtime", "packages/providers",
  "packages/memory", "packages/planner", "packages/compaction", "packages/spill", "packages/tools", "examples/demo",
  "packages/application", "packages/http-bridge", "packages/tauri-bridge", "apps/server",
  "examples/tauri-composition", "packages/models", "packages/skills",
  "packages/workspace", "packages/projects", "packages/sandbox", "packages/subagent", "packages/mcp", "apps/desktop"
]

# Default build excludes both transport bridges and composition examples.
default-members = [
  "packages/sessions", "packages/instructions",
  "packages/api", "packages/runtime", "packages/providers", "packages/application",
  "packages/memory", "packages/planner", "packages/compaction", "packages/spill", "packages/tools", "examples/demo"
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
api = { path = "packages/api" }
runtime = { path = "packages/runtime" }
providers = { path = "packages/providers" }
application = { path = "packages/application" }
http-bridge = { path = "packages/http-bridge" }
tauri-bridge = { package = "tauri-plugin-bridge", path = "packages/tauri-bridge" }
memory = { path = "packages/memory" }
planner = { path = "packages/planner" }
compaction = { path = "packages/compaction" }
spill = { path = "packages/spill" }
tools = { path = "packages/tools" }
sessions = { path = "packages/sessions" }
instructions = { path = "packages/instructions" }
sandbox = { path = "packages/sandbox" }
subagent = { path = "packages/subagent" }
mcp = { path = "packages/mcp" }
base64 = "0.22"
async-trait = "0.1.86"
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = "1.0.138"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { version = "0.7.13", features = ["rt"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1.9.0"
jsonschema = { version = "0.18.3", default-features = false, features = ["draft201909", "draft202012"] }

[workspace]
resolver = "2"
members = [
  "crates/agent-api", "crates/agent-core", "crates/agent-providers",
  "plugins/agent-memory", "plugins/agent-planner", "examples/demo",
  "crates/agent-application", "bridges/http", "bridges/tauri", "examples/server",
  "examples/tauri-composition"
]

# Default build excludes both transport bridges and composition examples.
default-members = [
  "crates/agent-api", "crates/agent-core", "crates/agent-providers", "crates/agent-application",
  "plugins/agent-memory", "plugins/agent-planner", "examples/demo"
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
agent-api = { path = "crates/agent-api" }
agent-core = { path = "crates/agent-core" }
agent-providers = { path = "crates/agent-providers" }
agent-application = { path = "crates/agent-application" }
agent-bridge-http = { path = "bridges/http" }
agent-bridge-tauri = { package = "tauri-plugin-agent-bridge", path = "bridges/tauri" }
agent-memory = { path = "plugins/agent-memory" }
agent-planner = { path = "plugins/agent-planner" }
async-trait = "0.1.86"
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = "1.0.138"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { version = "0.7.13", features = ["rt"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1.9.0"
jsonschema = { version = "0.18.3", default-features = false }
